# CI = PRD §6.1 架构静态门禁 + L1 确定性检查 + 前端质量门。
# 真端点用例（Green Path / Provider 合约）由环境变量门控，在 CI 中自动 skip，不花钱。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: pip install -e './backend[dev]'
      - name: Lint (ruff)
        run: ruff check backend/src backend/tests
      - name: Tests (L1 gates + unit)
        run: pytest backend/tests
        env:
          PYTHONPATH: backend/src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test:run
      - name: Build (type-checked)
        run: npm run build
