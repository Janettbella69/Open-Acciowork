# Backend lint and tests, frontend lint, tests and build.
# tests/test_e2e_cli.py (the real Claude Code CLI against a scripted local model) is skipped
# here: it needs the SDK sandbox, which on Ubuntu 24.04 needs bubblewrap plus an AppArmor
# profile (deploy/shared-box/README.md). Run it locally with OPHIRA_E2E_CLI=1.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e './backend[dev]'
      - name: Lint
        run: ruff check src tests
        working-directory: backend
      - name: Tests
        run: pytest
        working-directory: backend
        env:
          PYTHONPATH: src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  # The repository was renamed from Ophira-ai on 2026-08-20; an old pointer sends a new AI
  # session to a place that no longer exists.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stale-pointer guard
        run: |
          if git grep -nE "Janettbella69/Ophira-ai|/Users/[a-z]+/Ophira-ai" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Stale Ophira-ai pointer found — repo renamed to Open-Acciowork on 2026-08-20."
            exit 1
          fi
