# 场景 A-供给侧起点（PRD §3.5）：我能稳定供应 X，应该卖到哪里、找谁
id: a2-supply-entry
scenario: A
entry_point: supply
prompt: |
  uploads/factory-capability.md 是我们工厂的真实产能与认证情况（我自己写的）。
  请判断这批供给能力最适合优先进入哪个海外市场与渠道：给出 2-3 条候选路线的取舍比较、
  把关键依据记入证据账本（区分我的陈述与你的推断），用客户评分工具对候选客户画像
  做一次显式加权排序，最后把结论写成中文简报落盘工作区。
fixtures:
  - path: fixtures/factory-capability.md
    upload_as: factory-capability.md
    mime: text/markdown
expect:
  deny_marker: false
  required_coverage: [read, mcp, write]
  evidence_min: 1
  decision_required: false
  artifact_suffix: .md
minimum_pass:
  evaluator: snapshot-v1
  profile: task-supply-entry-v1
