[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ophira-backend"
version = "0.1.0"
description = "OPHIRA opportunity-team backend built on Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk==0.2.143",
  "croniter>=2,<7",
  "cryptography>=43,<51",
  "fastapi>=0.115,<1",
  # Claude Agent SDK 0.2.143 uses the MCP 1.x low-level Server decorator API.
  "mcp>=1.23,<2",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "sse-starlette>=2.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.49,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  # Eval harness task specs (evals/tasks/*.yaml) are read by backend/scripts/run_l2.py.
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
ophira-api = "ophira_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ophira_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Long Chinese prompt text and event-fixture data lines are data, not code.
"**/greenpath.py" = ["E501"]
"**/test_greenpath_verifier.py" = ["E501"]
