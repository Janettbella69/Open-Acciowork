[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ophira-backend"
version = "0.2.0"
description = "TradeMind backend: one Claude Agent SDK loop with a computer, a window, and a person in charge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk==0.2.189",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  # The Agent's own Python writes Office files with these (office-documents Skill).
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "python-multipart>=0.0.20",
  "sse-starlette>=2.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ophira_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is Chinese prose; its lines are data, not code.
"**/agent.py" = ["E501"]
# Tests inspect the snapshot repository with plain git calls.
"tests/**" = ["ASYNC221"]
